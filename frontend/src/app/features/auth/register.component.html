<section class="min-h-[70vh] bg-gradient-to-b from-slate-50 to-white py-10">
  <div class="container-xl flex justify-center">
    <div class="w-full max-w-xl rounded-2xl border border-slate-200 bg-white p-8 shadow-soft">
      <div class="mb-7 space-y-2 text-center">
        <p class="text-sm font-semibold uppercase tracking-[0.2em] text-primary-500">Create account</p>
        <h1 class="text-3xl font-semibold text-slate-900">Join Aurora Market</h1>
        <p class="text-sm text-slate-600">Choose your role and set up your account.</p>
      </div>

      <form class="space-y-5" [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="space-y-2">
          <label for="name" class="text-sm font-semibold text-slate-800">Name</label>
          <input
            id="name"
            type="text"
            formControlName="name"
            placeholder="Alex Morgan"
            class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-900"
          />
        </div>

        <div class="space-y-2">
          <label for="email" class="text-sm font-semibold text-slate-800">Email</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-900"
          />
        </div>

        <div class="space-y-2">
          <label for="password" class="text-sm font-semibold text-slate-800">Password</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="At least 8 characters"
            class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-900"
          />
        </div>

        <div class="space-y-2">
          <label for="role" class="text-sm font-semibold text-slate-800">Role</label>
          <select
            id="role"
            formControlName="role"
            class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-900 outline-none transition focus:border-slate-900"
          >
            <option value="CUSTOMER">Customer</option>
            <option value="VENDOR">Vendor</option>
          </select>
        </div>

        @if (error()) {
          <div class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-600">
            {{ error() }}
          </div>
        }

        <button
          type="submit"
          class="inline-flex w-full items-center justify-center rounded-xl bg-gradient-to-r from-primary-500 via-primary-600 to-primary-700 px-5 py-3 text-sm font-semibold text-white shadow-soft transition hover:from-primary-600 hover:via-primary-700 hover:to-primary-800 disabled:cursor-not-allowed disabled:opacity-70"
          [disabled]="loading()"
        >
          @if (loading()) {
            <span class="h-4 w-4 animate-spin rounded-full border-2 border-white/70 border-t-transparent"></span>
            <span class="ml-2">Creating account...</span>
          } @else {
            <span>Create account</span>
          }
        </button>

        <p class="text-center text-sm text-slate-600">
          Already registered?
          <a routerLink="/login" class="font-semibold text-primary-600 transition hover:text-primary-700">Sign in</a>
        </p>
      </form>
    </div>
  </div>
</section>
