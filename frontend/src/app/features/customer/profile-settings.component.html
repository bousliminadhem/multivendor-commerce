<section class="w-full space-y-6 text-slate-900">
  <header>
    <p class="text-sm font-semibold uppercase tracking-[0.2em] text-indigo-600">Customer</p>
    <h1 class="text-3xl font-semibold">Profile Settings</h1>
    <p class="mt-1 text-sm text-slate-600">Manage your account preferences and personal details.</p>
  </header>

  <div class="card p-6 transition duration-300 hover:-translate-y-1 hover:shadow-lg">
    <dl class="grid gap-4 sm:grid-cols-2">
      <div class="rounded-xl bg-slate-50 px-4 py-3">
        <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Name</dt>
        <dd class="mt-1 text-sm font-semibold text-slate-900">{{ fullName() }}</dd>
      </div>
      <div class="rounded-xl bg-slate-50 px-4 py-3">
        <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Email</dt>
        <dd class="mt-1 text-sm font-semibold text-indigo-700">{{ user()?.email || 'Not available' }}</dd>
      </div>
      <div class="rounded-xl bg-slate-50 px-4 py-3 sm:col-span-2">
        <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Role</dt>
        <dd class="mt-2">
          <span class="inline-flex rounded-full border border-amber-200 bg-amber-50 px-3 py-1 text-xs font-semibold text-amber-700">
            {{ user()?.role || 'CUSTOMER' }}
          </span>
        </dd>
      </div>
    </dl>
  </div>
</section>
