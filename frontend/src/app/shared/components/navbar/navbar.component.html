<header class="backdrop-blur supports-[backdrop-filter]:bg-white/80 sticky top-0 z-40 bg-white/90 ring-1 ring-slate-200/60">
  <div class="container-xl flex h-16 items-center gap-6">
    <a class="flex items-center gap-2 text-lg font-semibold tracking-tight" routerLink="/">
      <span class="h-3 w-3 rounded-full bg-slate-900"></span>
      <span class="text-slate-900">Aurora Market</span>
    </a>
    <div class="ml-auto flex items-center gap-3">
      @if (!authService.isLoggedIn()) {
        <a
          class="rounded-full px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
          routerLink="/login"
        >
          Login
        </a>
        <a
          class="rounded-full bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-soft transition hover:scale-[1.01]"
          routerLink="/register"
        >
          Register
        </a>
      } @else {
        <a
          class="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-800 shadow-xs transition hover:bg-slate-100"
          routerLink="/profile"
        >
          <span class="inline-flex h-7 w-7 items-center justify-center rounded-full bg-slate-900 text-xs font-semibold text-white">
            {{ vendorName()[0] || 'U' }}
          </span>
          <span>User Profile</span>
        </a>
        <button
          type="button"
          class="rounded-full border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
          (click)="onLogout()"
        >
          Logout
        </button>
      }
    </div>
  </div>
</header>
