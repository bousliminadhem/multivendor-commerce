# ── Datasource ──────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_db
spring.datasource.username=postgres
spring.datasource.password=root
server.port=8081

# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Java 21 Virtual Threads ─────────────────────────────────
# Enables virtual threads for Tomcat request handling (Project Loom)
spring.threads.virtual.enabled=true

# ── Scheduling (required for @Scheduled reservation cleanup) ─
spring.task.scheduling.pool.size=2

# ── JWT Configuration ───────────────────────────────────────
# Base64-encoded 256-bit secret (replace in production!)
app.jwt.secret=dGhpcyBpcyBhIHZlcnkgc2VjcmV0IGtleSBmb3IgSldUIHRva2VuIGdlbmVyYXRpb24gMjAyNg==
# Token validity in milliseconds (24 hours)
app.jwt.expiration-ms=86400000
spring.web.cors.allowed-origins=http://localhost:4200

# ── Stock Reservation TTL (minutes) ─────────────────────────
app.stock.reservation-ttl-minutes=15
